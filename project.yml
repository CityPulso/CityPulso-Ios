# XcodeGen spec — the .xcodeproj is generated, never committed:  xcodegen generate
#
# Same five modules as CityPulso-Android (Apple naming: UpperCamelCase, folder = module/target):
#   PulsoLinkCore  ← pulsolink-core (config, HTTP, auth session, DTOs; builds and tests on Linux too)
#   PulsoLinkUI    ← pulsolink-ui   (accent theme, thin compositions over native SwiftUI controls)
#   PulsoLink      ← pulsolink      (placeholder app, same as Android)
#   PulsoLoop      ← pulsoloop      (YouLoopy 跃圈)
#   PulsoNear      ← pulsonear      (YouNeary 娱邻)
name: CityPulso

options:
  bundleIdPrefix: com.citypulso
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"

packages:
  PulsoLinkCore:
    path: PulsoLinkCore
  PulsoLinkUI:
    path: PulsoLinkUI
  Factory:
    url: https://github.com/hmlongco/Factory.git
    from: 2.4.0
  # 报名 / 订场占座付款、绑卡、收款账户开通（Android stripe-android + connect）。
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm.git
    from: 24.0.0
  # 地图：OpenFreeMap 矢量样式（Android maplibre-android-sdk，WEB maplibre-gl）。
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution.git
    from: 6.0.0

targetTemplates:
  PulsoApp:
    type: application
    platform: iOS
    sources:
      - path: ${target_name}
        excludes:
          - Info.plist
          - Tests
    dependencies:
      - package: PulsoLinkCore
      - package: PulsoLinkUI
      - package: Factory
        product: Factory
    info:
      path: ${target_name}/Info.plist
      properties:
        CFBundleDisplayName: $(PULSO_DISPLAY_NAME)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, zh-Hant, en, fr]
        PulsoApiBaseURL: $(PULSO_API_BASE_URL)
        UILaunchScreen: {}
        # 源语言（zh-Hans）原文；其余语言由 Resources/InfoPlist.xcstrings 提供（Scripts/android_strings.py 生成）。
        NSLocationWhenInUseUsageDescription: 用于附近活动、地图定位和你的当前位置
        NSCameraUsageDescription: 用于聊天拍照发送图片。
        NSPhotoLibraryUsageDescription: 用于聊天从相册选择图片发送。
        NSMicrophoneUsageDescription: 用于聊天发送语音。
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Debug 连局域网里的 dev Traefik（http://<ip>:10101）；线上是 https，不受影响。
          NSAllowsLocalNetworking: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  PulsoLink:
    templates: [PulsoApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.citypulso.pulsolink
        PULSO_DISPLAY_NAME: PulsoLink
        PULSO_PUBLIC_HOST: pulsolink.com

  PulsoLoop:
    templates: [PulsoApp]
    dependencies:
      - package: Stripe
        product: StripePaymentSheet
      - package: Stripe
        product: StripePayments
      - package: Stripe
        product: StripeConnect
      - package: MapLibre
        product: MapLibre
    info:
      path: PulsoLoop/Info.plist
      properties:
        # Google iOS OAuth client（Google Cloud 项目 129233998164，与后端 web client 同一个项目）。
        GIDClientID: 129233998164-i2itt0ptv399f48rrm9lf25lvb4dkrml.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.googleusercontent.apps.129233998164-i2itt0ptv399f48rrm9lf25lvb4dkrml]
    scheme:
      testTargets: [PulsoLoopTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.citypulso.pulsoloop
        PULSO_DISPLAY_NAME: 跃圈
        PULSO_PUBLIC_HOST: pulsoloop.com
        # 「通过 Apple 登录」要付费开发者账号才能签名；Local.xcconfig 设 PULSO_APPLE_SIGN_IN = YES 后才带上权限。
        CODE_SIGN_ENTITLEMENTS: $(PULSO_ENTITLEMENTS_$(PULSO_APPLE_SIGN_IN))
        PULSO_ENTITLEMENTS_YES: PulsoLoop/PulsoLoop.entitlements
        # 「深色」桌面图标套图（LauncherIcon.dark）用的系统备用图标。
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Dark
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"

  PulsoNear:
    templates: [PulsoApp]
    dependencies:
      - package: Stripe
        product: StripePaymentSheet
      - package: Stripe
        product: StripePayments
      - package: Stripe
        product: StripeConnect
      - package: MapLibre
        product: MapLibre
    info:
      path: PulsoNear/Info.plist
      properties:
        # Google iOS OAuth client（Google Cloud 项目 129233998164，与后端 web client 同一个项目）。
        GIDClientID: 129233998164-2dv2ameks492jges1pob54ka39bt86m0.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.googleusercontent.apps.129233998164-2dv2ameks492jges1pob54ka39bt86m0]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.citypulso.pulsonear
        PULSO_DISPLAY_NAME: 娱邻
        PULSO_PUBLIC_HOST: pulsonear.com
        # 「通过 Apple 登录」要付费开发者账号才能签名；Local.xcconfig 设 PULSO_APPLE_SIGN_IN = YES 后才带上权限。
        CODE_SIGN_ENTITLEMENTS: $(PULSO_ENTITLEMENTS_$(PULSO_APPLE_SIGN_IN))
        PULSO_ENTITLEMENTS_YES: PulsoNear/PulsoNear.entitlements
        # 「深色」桌面图标套图（LauncherIcon.dark）用的系统备用图标。
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Dark
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"

  # 宿主在 PulsoLoop 里跑的测试（截图等需要 UIKit 窗口的测试）。
  PulsoLoopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PulsoLoop/Tests
    # 只依赖宿主 App：包作为静态库链进 App，测试从 App 里拿符号。再单独声明包会让 Xcode 把它们改成动态框架，
    # GoogleSignIn 的动态框架不会带上 AppAuth，链接失败。
    dependencies:
      - target: PulsoLoop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.citypulso.pulsoloop.tests
