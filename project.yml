# XcodeGen spec — the .xcodeproj is generated, never committed:  xcodegen generate
#
# Same five modules as CityPulso-Android (Apple naming: UpperCamelCase, folder = module/target):
#   PulsoLinkCore  ← pulsolink-core (config, HTTP, auth session, DTOs; builds and tests on Linux too)
#   PulsoLinkUI    ← pulsolink-ui   (accent theme, thin compositions over native SwiftUI controls)
#   PulsoLink      ← pulsolink      (placeholder app, same as Android)
#   PulsoLoop      ← pulsoloop      (YouLoopy 跃圈)
#   PulsoNear      ← pulsonear      (YouNeary 娱邻)
name: CityPulso

options:
  bundleIdPrefix: com.citypulso
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"

packages:
  PulsoLinkCore:
    path: PulsoLinkCore
  PulsoLinkUI:
    path: PulsoLinkUI
  Factory:
    url: https://github.com/hmlongco/Factory.git
    from: 2.4.0

targetTemplates:
  PulsoApp:
    type: application
    platform: iOS
    sources:
      - path: ${target_name}
        excludes:
          - Info.plist
    dependencies:
      - package: PulsoLinkCore
      - package: PulsoLinkUI
      - package: Factory
        product: Factory
    info:
      path: ${target_name}/Info.plist
      properties:
        CFBundleDisplayName: $(PULSO_DISPLAY_NAME)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, zh-Hant, en, fr]
        PulsoApiBaseURL: $(PULSO_API_BASE_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Debug 连局域网里的 dev Traefik（http://<ip>:10101）；线上是 https，不受影响。
          NSAllowsLocalNetworking: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  PulsoLink:
    templates: [PulsoApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.citypulso.pulsolink
        PULSO_DISPLAY_NAME: PulsoLink
        PULSO_PUBLIC_HOST: pulsolink.com

  PulsoLoop:
    templates: [PulsoApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.citypulso.pulsoloop
        PULSO_DISPLAY_NAME: 跃圈
        PULSO_PUBLIC_HOST: pulsoloop.com

  PulsoNear:
    templates: [PulsoApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.citypulso.pulsonear
        PULSO_DISPLAY_NAME: 娱邻
        PULSO_PUBLIC_HOST: pulsonear.com
