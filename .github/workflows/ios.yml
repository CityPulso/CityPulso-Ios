name: iOS

# 仓库公开，标准 runner 不计分钟：
# - core 测试在 Linux 上跑；
# - 三个 App 在一个 macOS 任务里依次编译、共用依赖，每次 push 都跑；
# - 截图只在手动触发并勾选时跑。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Run the simulator screenshot tests too
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: PulsoLinkCore tests
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # GRDB 在 Linux 上用系统 SQLite。
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev
      - name: swift test
        run: swift test --package-path PulsoLinkCore -Xlinker --allow-shlib-undefined

  build:
    name: Build apps
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          xcodegen generate
      - name: Check generated Info.plist
        run: |
          set -euo pipefail
          for app in PulsoLoop PulsoNear; do
            plutil -extract GIDClientID raw "$app/Info.plist"
            plutil -extract CFBundleDisplayName raw "$app/Info.plist"
          done
      - name: Build for simulator
        run: |
          set -euo pipefail
          status=0
          for scheme in PulsoLoop PulsoNear PulsoLink; do
            echo "::group::$scheme"
            xcodebuild \
              -project CityPulso.xcodeproj \
              -scheme "$scheme" \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build \
              build \
              CODE_SIGNING_ALLOWED=NO || status=1
            echo "::endgroup::"
          done
          exit $status

  screenshots:
    name: Shell screenshots
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    runs-on: macos-26
    timeout-minutes: 60
    # 手机和平板各截一套。
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          xcodegen generate
      - name: Pick a ${{ matrix.device }} simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith(sys.argv[1])))
          ' "${{ matrix.device }}")
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
      - name: Run screenshot tests
        env:
          SCREENSHOT_EMAIL: ${{ secrets.SCREENSHOT_EMAIL }}
          SCREENSHOT_PASSWORD: ${{ secrets.SCREENSHOT_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "screenshots/${{ matrix.device }}"
          # 两个 App 各跑一遍；一个崩了不影响另一个的截图。
          status=0
          for scheme in PulsoLoop PulsoNear; do
            # 连 dev 后端的公网域名（各 App 自己的 PULSO_PUBLIC_HOST），用截图账号登录拿真数据。
            TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots/${{ matrix.device }}" \
            TEST_RUNNER_SCREENSHOT_EMAIL="$SCREENSHOT_EMAIL" \
            TEST_RUNNER_SCREENSHOT_PASSWORD="$SCREENSHOT_PASSWORD" \
            xcodebuild test \
              -project CityPulso.xcodeproj \
              -scheme "$scheme" \
              -destination "id=$SIMULATOR_UDID" \
              -derivedDataPath build \
              'PULSO_API_BASE_URL=https://$(PULSO_PUBLIC_HOST)/api' \
              CODE_SIGNING_ALLOWED=NO || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.device }}
          path: screenshots/
          if-no-files-found: warn
