name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: PulsoLinkCore tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: swift test
        run: swift test --package-path PulsoLinkCore

  build:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scheme: [PulsoLink, PulsoLoop, PulsoNear]
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          xcodegen generate
      - name: Check generated Info.plist
        if: matrix.scheme != 'PulsoLink'
        run: |
          set -euo pipefail
          plutil -p "${{ matrix.scheme }}/Info.plist"
          plutil -extract GIDClientID raw "${{ matrix.scheme }}/Info.plist"
          plutil -extract CFBundleDisplayName raw "${{ matrix.scheme }}/Info.plist"
      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project CityPulso.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO

  screenshots:
    name: Shell screenshots
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          xcodegen generate
      - name: Pick an iPhone simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
      - name: Run screenshot tests
        run: |
          set -euo pipefail
          mkdir -p screenshots
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots" xcodebuild test \
            -project CityPulso.xcodeproj \
            -scheme PulsoLoop \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
