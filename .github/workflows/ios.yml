name: iOS

# 仓库公开，标准 runner 不计分钟：
# - core 测试在 Linux 上跑；
# - 三个 App 在一个 macOS 任务里依次编译、共用依赖，每次 push 都跑；
# - 截图只在手动触发并勾选时跑。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Run the simulator screenshot tests too
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: PulsoLinkCore tests
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: swift test
        run: swift test --package-path PulsoLinkCore -Xlinker --allow-shlib-undefined

  build:
    name: Build apps
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          xcodegen generate
      - name: Check generated Info.plist
        run: |
          set -euo pipefail
          for app in PulsoLoop PulsoNear; do
            plutil -extract GIDClientID raw "$app/Info.plist"
            plutil -extract CFBundleDisplayName raw "$app/Info.plist"
          done
      - name: Build for simulator
        run: |
          set -euo pipefail
          status=0
          for scheme in PulsoLoop PulsoNear PulsoLink; do
            echo "::group::$scheme"
            xcodebuild \
              -project CityPulso.xcodeproj \
              -scheme "$scheme" \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build \
              build \
              CODE_SIGNING_ALLOWED=NO || status=1
            echo "::endgroup::"
          done
          exit $status

  screenshots:
    name: Shell screenshots
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          xcodegen generate
      - name: Pick an iPhone simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
      - name: Run screenshot tests
        run: |
          set -euo pipefail
          mkdir -p screenshots
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots" xcodebuild test \
            -project CityPulso.xcodeproj \
            -scheme PulsoLoop \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
